<script>
    // ------------------------------
    // 1. DEMO DATA (extracted from your existing cards + added picsumId)
    // ------------------------------
    const allListings = [
        { id: 1, title: "MacBook Pro 2021 — Minor Scuffs", category: "electronics", currentBid: 12400, startingBid: 10000, bidCount: 7, catEmoji: "💻", endTime: "2026-05-13T15:30:00Z", isNew: true, hasBuyNow: false, buyNowPrice: null, createdAt: "2026-05-12T10:00:00Z", picsumId: "0" },   // Alejandro Escamilla - landscape
        { id: 2, title: "Calculus Textbook + Solutions Manual", category: "books", currentBid: 850, startingBid: 500, bidCount: 3, catEmoji: "📚", endTime: "2026-05-13T18:00:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-10T09:00:00Z", picsumId: "4" },    // close-up keyboard
        { id: 3, title: "Sony WH-1000XM4 Headphones", category: "electronics", currentBid: 5200, startingBid: 4000, bidCount: 12, catEmoji: "💻", endTime: "2026-05-14T20:00:00Z", isNew: false, hasBuyNow: true, buyNowPrice: 7000, createdAt: "2026-05-09T14:30:00Z", picsumId: "10" },   // Paul Jarvis - nature
        { id: 4, title: "University Hoodie — Size M, Never Worn", category: "clothes", currentBid: 600, startingBid: 300, bidCount: 1, catEmoji: "👕", endTime: "2026-05-15T23:59:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-11T18:20:00Z", picsumId: "15" },   // Paul Jarvis - landscape
        { id: 5, title: "IKEA Desk Chair — Good Condition", category: "furniture", currentBid: 1000, startingBid: 1000, bidCount: 0, catEmoji: "🪑", endTime: "2026-05-16T12:00:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-08T11:00:00Z", picsumId: "20" },   // Aleks Dorohovich - architecture
        { id: 6, title: "Adidas Football, Size 5 — Used Once", category: "sports", currentBid: 400, startingBid: 300, bidCount: 2, catEmoji: "⚽", endTime: "2026-05-13T22:00:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-12T08:15:00Z", picsumId: "25" },   // Alejandro Escamilla - landscape
        { id: 7, title: "Nintendo Switch + 3 Games Bundle", category: "electronics", currentBid: 9500, startingBid: 8000, bidCount: 5, catEmoji: "💻", endTime: "2026-05-18T09:00:00Z", isNew: true, hasBuyNow: false, createdAt: "2026-05-13T07:00:00Z", picsumId: "30" },   // landscape
        { id: 8, title: "Fjällräven Kånken Backpack — Black", category: "other", currentBid: 2100, startingBid: 1500, bidCount: 4, catEmoji: "🎲", endTime: "2026-05-13T19:30:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-11T16:45:00Z", picsumId: "35" }    // landscape
    ];

    // Additional mock items to demonstrate "Load More"
    const extraListings = [
        { id: 9, title: "Python Crash Course Book", category: "books", currentBid: 450, startingBid: 200, bidCount: 2, catEmoji: "📚", endTime: "2026-05-14T14:00:00Z", isNew: true, hasBuyNow: false, createdAt: "2026-05-13T09:00:00Z", picsumId: "40" },   // landscape
        { id: 10, title: "Mechanical Keyboard (Blue Switches)", category: "electronics", currentBid: 3200, startingBid: 2500, bidCount: 8, catEmoji: "💻", endTime: "2026-05-15T18:00:00Z", isNew: false, hasBuyNow: true, buyNowPrice: 4500, createdAt: "2026-05-10T20:00:00Z", picsumId: "45" },   // landscape
        { id: 11, title: "Winter Jacket — Size L", category: "clothes", currentBid: 1200, startingBid: 800, bidCount: 3, catEmoji: "👕", endTime: "2026-05-17T10:00:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-09T12:00:00Z", picsumId: "50" },   // landscape
        { id: 12, title: "Yoga Mat — barely used", category: "sports", currentBid: 350, startingBid: 250, bidCount: 1, catEmoji: "🎲", endTime: "2026-05-14T20:00:00Z", isNew: false, hasBuyNow: false, createdAt: "2026-05-12T08:00:00Z", picsumId: "55" }    // landscape
    ];
    // Merge all into one dataset
    const fullListings = [...allListings, ...extraListings];

    // ------------------------------
    // 2. Global State
    // ------------------------------
    let currentFilter = "all";
    let currentSort = "endingSoon";
    const startCount = 4;
    const incrementCount = 4;
    let displayedCount = startCount;          // how many cards currently shown (starting batch)
    let currentListings = [];         // filtered + sorted version of fullListings
    let activeTimers = [];            // store intervals to clear on re-render

    // ------------------------------
    // 3. Helper Functions
    // ------------------------------
    function getRemainingSeconds(endTimeISO) {
        const end = new Date(endTimeISO);
        const now = new Date();
        return Math.max(0, Math.floor((end - now) / 1000));
    }

    function formatTime(secs) {
        if (secs <= 0) return 'Ended';
        if (secs < 3600) {
            const m = Math.floor(secs / 60), s = secs % 60;
            return `${m}:${String(s).padStart(2,'0')}`;
        }
        if (secs < 86400) {
            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
            return `${h}h ${m}m`;
        }
        const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600);
        return `${d}d ${h}h`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Filter & sort logic
    function applyFilterAndSort() {
        let filtered = [...fullListings];
        if (currentFilter !== "all") {
            filtered = filtered.filter(item => item.category === currentFilter);
        }
        // Sort
        switch (currentSort) {
            case "newest":
                filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                break;
            case "price_asc":
                filtered.sort((a,b) => a.currentBid - b.currentBid);
                break;
            case "price_desc":
                filtered.sort((a,b) => b.currentBid - a.currentBid);
                break;
            case "mostBids":
                filtered.sort((a,b) => b.bidCount - a.bidCount);
                break;
            default: // endingSoon
                filtered.sort((a,b) => new Date(a.endTime) - new Date(b.endTime));
        }
        return filtered;
    }

    // Create one card DOM element with Picsum image
    function createCardElement(auction) {
        const card = document.createElement('a');
        card.href = `auctions-detail.html?id=${auction.id}`;
        card.className = 'auction-card bg-white rounded-2xl shadow-sm overflow-hidden block';

        const remainingSecs = getRemainingSeconds(auction.endTime);
        const timeStr = formatTime(remainingSecs);
        const isUrgent = remainingSecs < 300;

        let leftBadges = '';
        if (auction.isNew) leftBadges += '<span class="badge-new text-white text-xs font-bold px-2 py-0.5 rounded-full">NEW</span>';
        if (auction.hasBuyNow) leftBadges += '<span class="bg-amber-400 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-1">BUY NOW</span>';

        // Build image URL from Picsum
        const imageUrl = `https://picsum.photos/id/${auction.picsumId}/400/300`;

        card.innerHTML = `
            <div class="relative">
                <div class="image-container bg-gradient-to-br from-swamp-100 to-swamp-200">
                    <img src="${imageUrl}"
                         alt="${escapeHtml(auction.title)}"
                         class="auction-image"
                         onerror="this.onerror=null; this.src='https://picsum.photos/id/0/400/300'; this.parentElement.parentElement.querySelector('.image-fallback').style.display='flex'; this.style.display='none';">
                    <div class="image-fallback" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; align-items: center; justify-content: center; font-size: 3rem; background: linear-gradient(to bottom right, #dcfce7, #bbf7d0);">
                        ${auction.catEmoji}
                    </div>
                </div>
                <div class="absolute top-2 left-2 flex gap-1">
                    ${leftBadges}
                </div>
                <div class="absolute top-2 right-2 bg-black/60 backdrop-blur text-white text-xs font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12H9m12 0A9 9 0 1 1 3 12a9 9 0 0 1 18 0z"/>
                    </svg>
                    <span class="${isUrgent ? 'countdown-urgent' : ''}" data-endtime="${auction.endTime}">${timeStr}</span>
                </div>
            </div>
            <div class="p-3">
                <p class="text-xs text-swamp-500 font-semibold capitalize">${auction.category}</p>
                <h3 class="font-bold text-swamp-900 text-sm leading-tight mt-0.5 line-clamp-2">${escapeHtml(auction.title)}</h3>
                <div class="mt-2 flex items-end justify-between">
                    <div>
                        <p class="text-xs text-swamp-400 font-semibold">Current bid</p>
                        <p class="text-lg font-black text-swamp-700">₽${auction.currentBid.toLocaleString()}</p>
                    </div>
                    <p class="text-xs text-swamp-400 font-semibold">${auction.bidCount} ${auction.bidCount === 1 ? 'bid' : 'bids'}</p>
                </div>
            </div>
        `;
        return card;
    }

    // Re-render the grid: clear, show only first `displayedCount` items from currentListings
    function renderGrid() {
        const grid = document.getElementById('auctions-grid');
        grid.innerHTML = '';
        const itemsToShow = currentListings.slice(0, displayedCount);
        itemsToShow.forEach(auction => {
            grid.appendChild(createCardElement(auction));
        });
        // Update listings count text
        const countSpan = document.getElementById('listings-count');
        countSpan.textContent = `${currentListings.length} active listings`;
        // Show/hide load more button
        const loadBtn = document.getElementById('load-more-btn');
        if (displayedCount >= currentListings.length) {
            loadBtn.style.display = 'none';
        } else {
            loadBtn.style.display = 'inline-block';
        }
        // Re-attach countdown timers to new cards (clear old intervals first)
        activeTimers.forEach(clearInterval);
        activeTimers = [];
        document.querySelectorAll('[data-endtime]').forEach(el => {
            const endTimeISO = el.dataset.endtime;
            const updateTimer = () => {
                const secs = getRemainingSeconds(endTimeISO);
                el.textContent = formatTime(secs);
                if (secs < 300) el.classList.add('countdown-urgent');
                if (secs <= 0) {
                    clearInterval(interval);
                    el.textContent = 'Ended';
                }
            };
            updateTimer();
            const interval = setInterval(updateTimer, 1000);
            activeTimers.push(interval);
        });
    }

    // Refresh everything when filter/sort changes
    function refreshListings(resetDisplayed = true) {
        currentListings = applyFilterAndSort();
        if (resetDisplayed) {
            displayedCount = startCount;  // reset to initial batch size
        }
        renderGrid();
    }

    function loadMore() {
        const remaining = currentListings.length - displayedCount;
        const increment = Math.min(incrementCount, remaining);
        displayedCount += increment;
        renderGrid();
    }

    // ------------------------------
    // 4. Event Listeners
    // ------------------------------
    // Filter chips
    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', (e) => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.getAttribute('data-filter');
            refreshListings(true);
        });
    });
    // Sort dropdown
    document.getElementById('sort-select').addEventListener('change', (e) => {
        currentSort = e.target.value;
        refreshListings(true);
    });
    // Load more button
    document.getElementById('load-more-btn').addEventListener('click', loadMore);

    // Optional: simple search (basic text filter)
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm === "") {
                refreshListings(true);
            } else {
                // We re-filter fullListings temporarily (respecting current category filter)
                let filtered = [...fullListings];
                if (currentFilter !== "all") {
                    filtered = filtered.filter(item => item.category === currentFilter);
                }
                filtered = filtered.filter(item => item.title.toLowerCase().includes(searchTerm));
                // Apply current sort
                switch (currentSort) {
                    case "newest": filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); break;
                    case "price_asc": filtered.sort((a,b) => a.currentBid - b.currentBid); break;
                    case "price_desc": filtered.sort((a,b) => b.currentBid - a.currentBid); break;
                    case "mostBids": filtered.sort((a,b) => b.bidCount - a.bidCount); break;
                    default: filtered.sort((a,b) => new Date(a.endTime) - new Date(b.endTime));
                }
                currentListings = filtered;
                displayedCount = startCount;
                renderGrid();
            }
        });
    }

    // Initial load
    refreshListings(true);

    // Mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', () => {
        const m = document.getElementById('mobile-menu');
        m.classList.toggle('hidden'); m.classList.toggle('block');
    });
</script>
</body>
